name: Signaler une anomalie du site
description: Un bug, un problème d'affichage ou d'accessibilité.
title: '[Anomalie] '
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page concernée
    validations:
      required: true
  - type: textarea
    id: constat
    attributes:
      label: Ce qui se passe et ce qui était attendu
    validations:
      required: true
  - type: input
    id: appareil
    attributes:
      label: Appareil et navigateur
      placeholder: Android 15, Firefox 140
