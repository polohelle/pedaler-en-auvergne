# Réglages pnpm du projet (pas de monorepo).

# @vite-pwa/astro 1.2.0 ne déclare que jusqu'à Astro 5 ; testé et retenu avec Astro 7 (ADR 0015).
peerDependencyRules:
  allowedVersions:
    '@vite-pwa/astro>astro': '7'

# Le binaire d'esbuild vient d'un paquet propre à la plateforme : son script de
# vérification à l'installation n'est pas nécessaire.
ignoredBuiltDependencies:
  - esbuild

# Rolldown (via Astro 7.4.7) tire @emnapi/runtime 2.0.0-beta, que pnpm partage avec
# @astrojs/check : son module WebAssembly plante alors et `astro check` échoue. On garde
# la version stable ; la liaison wasm de Rolldown n'est pas utilisée hors navigateur.
overrides:
  '@emnapi/runtime': 1.11.3
  '@emnapi/core': 1.11.3
