# Carnet des sources de veille de Pédaler en Auvergne.
#
# Lu par les agents de veille et de collecte (.claude/agents/) ; validé par
# src/schemas/source.ts (pnpm test). Enrichir cette liste suffit à étendre la veille ;
# ouvrir un département, c'est y ajouter ses sources locales.
#
# Champs : nom, url, type (rss | page | agenda | traces), niveau (local | regional | national),
# departement (null hors local), acteur (slug dans l'annuaire, ou null),
# fiabilite (inconnue | faible | moyenne | haute, mise à jour par le skill evaluer-source),
# frequence (quotidienne | bihebdomadaire | hebdomadaire | mensuelle),
# dernier_passage (AAAA-MM-JJ, ou null), notes (facultatif).
#
# Reprise : aucune source n'autorise la copie de texte ou d'image. On publie un résumé
# rédigé avec nos mots, daté, avec le lien vers la source. Seules les données sous Licence
# Ouverte ou ODbL peuvent être importées dans l'annuaire.

sources:
  # Médias écartés le 2026-10-19 (demandés par l'administrateur, conditions incompatibles) :
  # - La Montagne (lamontagne.fr) : tout accès automatisé bloqué (HTTP 403 Cloudflare, y
  #   compris robots.txt et mentions légales) ;
  # - ici Pays d'Auvergne, ex-France Bleu (ici.fr) et France 3 Auvergne
  #   (france3-regions.franceinfo.fr) : leurs conditions interdisent la lecture par des
  #   robots et des agents d'IA sans accord écrit (réserve de fouille de textes) ;
  # - Zap (myzap.fr) : tout accès automatisé bloqué (HTTP 403 Cloudflare) ;
  # - Clermont Infos63 (clermontinfos63.fr) : ses CGU interdisent de reproduire ou de
  #   résumer les contenus sans autorisation de l'éditeur.
  # Leurs articles transmis à la main par l'administrateur servent de piste, à confirmer
  # chez la source d'origine.

