# Carnet des sources de veille de Pédaler en Auvergne.
#
# Lu par les agents de veille et de collecte (.claude/agents/) ; validé par
# src/schemas/source.ts (pnpm test). Enrichir cette liste suffit à étendre la veille ;
# ouvrir un département, c'est y ajouter ses sources locales.
#
# Champs : nom, url, type (rss | page | agenda), niveau (local | regional | national),
# departement (null hors local), acteur (slug dans l'annuaire, ou null),
# fiabilite (inconnue | faible | moyenne | haute, mise à jour par le skill evaluer-source),
# frequence (quotidienne | bihebdomadaire | hebdomadaire | mensuelle),
# dernier_passage (AAAA-MM-JJ, ou null), notes (facultatif).
#
# Reprise : aucune source n'autorise la copie de texte ou d'image. On publie un résumé
# rédigé avec nos mots, daté, avec le lien vers la source. Seules les données sous Licence
# Ouverte ou ODbL peuvent être importées dans l'annuaire.

sources:
  # --- Local : Puy-de-Dôme -------------------------------------------------

  - nom: Vélocité 63
    url: https://www.helloasso.com/associations/velocite-63
    type: page
    niveau: local
    departement: '63'
    acteur: null
    fiabilite: moyenne
    frequence: mensuelle
    dernier_passage: null
    notes: >-
      Association d'usagers, relais de la FUB depuis 1996, membre fondateur pressenti
      du collège Usagers. Évaluée le 2026-10-14 : page HelloAsso lisible mais sans actualité
      ni date (adhésion et services seulement). Demander à l'association son canal
      d'actualité et le substituer à cette adresse.

  - nom: Miles Republic — épreuves vélo du Puy-de-Dôme
    url: https://fr.milesrepublic.com/velo/puy-de-dome
    type: agenda
    niveau: local
    departement: '63'
    acteur: null
    fiabilite: moyenne
    frequence: hebdomadaire
    dernier_passage: null
    notes: >-
      Calendrier des épreuves sportives ; source de l'agenda (courses, randonnées).
      Évaluée le 2026-10-14 : 47 épreuves, datées au mois, la plupart « date à confirmer » ;
      aucun flux ni export. Agrégateur : confirmer chaque date chez l'organisateur et lier
      ce dernier. Limite le débit des requêtes (HTTP 429) : espacer les passages.

  - nom: Ville de Clermont-Ferrand — agenda (open data)
    url: https://www.data.gouv.fr/datasets/agenda-ville-de-clermont-ferrand
    type: agenda
    niveau: local
    departement: '63'
    acteur: null
    fiabilite: haute
    frequence: hebdomadaire
    dernier_passage: null
    notes: >-
      Remplace clermont-ferrand.fr, dont le robots.txt refuse les agents (2026-10-14).
      Agenda publié sous Licence Ouverte 2.0 par Clermont Auvergne Métropole, issu d'Apidae
      (Clermont Auvergne Volcans, Métropole, Département), en CSV et JSON, annoncé quotidien
      (dernière mise à jour constatée : 2026-09-24). Tous types d'événements : ne retenir
      que le vélo (Fête du Vélo, place de Jaude, fin mai ; bourses, balades). Les actualités
      municipales restent à suivre à la main.

  - nom: Clermont Auvergne Métropole
    url: https://www.clermontmetropole.eu
    type: page
    niveau: local
    departement: '63'
    acteur: null
    fiabilite: haute
    frequence: mensuelle
    dernier_passage: '2026-10-16'
    notes: >-
      Mobilités, plan vélo métropolitain, location C.Vélo, aménagements des 21 communes.
      Évaluée le 2026-10-14 : pas de flux RSS ; actualités datées (jour et mois, sans année)
      dans /actualites-et-agendas/toute-lactualite/, avec un filtre « Vélo » ; peu d'actualités
      vélo. Suivre aussi les pages « À vélo » et « Le schéma cyclable métropolitain ».

  # --- National, utile à l'annuaire et à l'agenda local --------------------

  - nom: Mai à vélo — agenda OpenAgenda
    url: https://openagenda.com/fr/maiavelo
    type: agenda
    niveau: national
    departement: null
    acteur: null
    fiabilite: moyenne
    frequence: hebdomadaire
    dernier_passage: null
    notes: >-
      Carte nationale des événements de mai, alimentée par OpenAgenda : filtrer sur
      le département. Passage quotidien en avril et mai. Évaluée le 2026-10-14 : la page est
      rendue en JavaScript et illisible par les agents ; passer par l'export ICS ou l'API
      OpenAgenda (clé gratuite à créer, à garder hors du dépôt). Données sous licence ouverte
      selon OpenAgenda ; saisie déclarative des organisateurs, à recouper.

  - nom: Mai à vélo — actualités
    url: https://maiavelo.fr/feed/
    type: rss
    niveau: national
    departement: null
    acteur: null
    fiabilite: haute
    frequence: hebdomadaire
    dernier_passage: null
    notes: >-
      Évaluée le 2026-10-14 : flux valide, 2 à 4 articles par mois. Éditeur : APIC, pour le
      collectif Mai à vélo ; reproduction interdite sans accord écrit, résumé et lien seulement.

  - nom: L'Heureux Cyclage — ateliers participatifs
    url: https://www.heureux-cyclage.org
    type: page
    niveau: national
    departement: null
    acteur: null
    fiabilite: inconnue
    frequence: mensuelle
    dernier_passage: null
    notes: >-
      Réseau et carte des ateliers vélo participatifs : source de l'annuaire (catégorie
      atelier participatif) et de la veille nationale. Protégé contre les robots (HTTP 402) ;
      encore inaccessible le 2026-10-14. Pour l'annuaire, passer par OpenStreetMap (ODbL)
      ou demander un export au réseau.

  - nom: Les Boîtes à Vélo
    url: https://lesboitesavelo.org/
    type: page
    niveau: national
    departement: null
    acteur: null
    fiabilite: moyenne
    frequence: mensuelle
    dernier_passage: null
    notes: >-
      Réseau de plus de 350 professionnels à vélo : source de l'annuaire (entreprises à vélo)
      et de la veille nationale. Évaluée le 2026-10-14 : pas de flux, actualités sans date ;
      annuaire rendu en JavaScript. Mentions légales : tous droits réservés, bases de données
      comprises, donc pas d'import ; repérer les membres du 63 et les contacter un par un.

  - nom: France Vélo Tourisme — Accueil Vélo
    url: https://www.francevelotourisme.com/accueil-velo
    type: page
    niveau: national
    departement: null
    acteur: null
    fiabilite: haute
    frequence: mensuelle
    dernier_passage: null
    notes: >-
      Prestataires et hébergeurs labellisés Accueil Vélo (service accueil-velo de l'annuaire).
      Itinéraires : renvoi, pas de reprise. Label porté localement par le Département
      et les offices de tourisme. Évaluée le 2026-10-14 : reproduction interdite sans accord,
      aucun export ; pour importer, passer par DATAtourisme, où les prestataires Accueil Vélo
      sont publiés sous Licence Ouverte 2.0.

  # --- National : veille réglementaire, aides, campagnes, chiffres ---------

  - nom: FUB — Parlons vélo
    url: https://www.parlons-velo.fr
    type: page
    niveau: national
    departement: null
    acteur: null
    fiabilite: moyenne
    frequence: mensuelle
    dernier_passage: '2026-10-16'
    notes: >-
      Site de campagne de la FUB (baromètre des villes cyclables, campagnes électorales).
      Remplace fub.fr, dont le robots.txt refuse les agents (2026-10-14). Lisible mais sans
      date de publication. Les réseaux sociaux de la FUB (Facebook, X, LinkedIn) interdisent
      la collecte automatisée : non retenus. Les communiqués de la FUB arrivent aussi par
      Réseau vélo et marche, Transition Vélo et Vélocité 63 ; la lettre d'information de la
      FUB est à suivre à la main.

  - nom: Réseau vélo et marche
    url: https://reseau-velo-marche.org
    type: page
    niveau: national
    departement: null
    acteur: null
    fiabilite: haute
    frequence: mensuelle
    dernier_passage: '2026-10-16'
    notes: >-
      Ex-Vélo & Territoires : collectivités, schémas cyclables, chiffres de fréquentation.
      Relaie les communiqués de l'Alliance pour le vélo, qui n'a pas de site propre identifié.
      Évaluée le 2026-10-14 : le flux /feed/ est valide mais vide ; l'accueil liste des
      actualités datées, 1 à 2 par mois.

  - nom: ADEME — aides financières
    url: https://agirpourlatransition.ademe.fr/entreprises/aides-financieres
    type: page
    niveau: national
    departement: null
    acteur: null
    fiabilite: haute
    frequence: mensuelle
    dernier_passage: null
    notes: >-
      Appels à projets et aides (aménagements, cyclologistique). Remplace l'accueil
      ademe.fr, qui n'a ni flux ni rubrique vélo (2026-10-14). Études : rubrique « Air et
      mobilité » d'ademe.fr. Refusée aux agents le
      2026-10-16 (HTTP 403) : à réévaluer au prochain passage, retrait si l'échec se répète.

  - nom: Journal officiel (Légifrance)
    url: https://www.legifrance.gouv.fr
    type: page
    niveau: national
    departement: null
    acteur: null
    fiabilite: haute
    frequence: hebdomadaire
    dernier_passage: null
    notes: >-
      Lois, décrets et arrêtés relatifs au vélo (code de la route, aides). Évaluée le
      2026-10-14 : lisible (recherche du JORF par date), pas de flux visible. Textes officiels
      librement réutilisables. À terme, l'API Légifrance (compte PISTE gratuit) permet une
      recherche automatique.

  - nom: Weelz!
    url: https://weelz.ouest-france.fr/feed/
    type: rss
    niveau: national
    departement: null
    acteur: null
    fiabilite: inconnue
    frequence: bihebdomadaire
    dernier_passage: null
    notes: >-
      Média vélo hors compétition ; ne retenir que ce qui concerne les acteurs locaux.
      Inaccessible à l'outil de lecture des agents le 2026-10-14 : à réévaluer, retrait si
      l'échec se répète.

  - nom: Transition Vélo
    url: https://www.transitionvelo.com/feed/
    type: rss
    niveau: national
    departement: null
    acteur: null
    fiabilite: moyenne
    frequence: bihebdomadaire
    dernier_passage: '2026-10-16'
    notes: >-
      Actualité, filière, réglementation ; ne retenir que ce qui concerne les acteurs locaux.
      Évaluée le 2026-10-14 : flux valide, 3 à 4 articles par jour, surtout produits et filière
      nationale. Éditeur : Back Wheel (SARL de presse) ; reproduction interdite, résumé et
      lien seulement.
